<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Cardinal Consultora">
  <title>Cardinal Consultora</title>
  <!-- Isotipo: 4-point compass star -->
  <g transform="translate(10,10)">
    <!-- Outer ring -->
    <circle cx="60" cy="60" r="58" fill="none" stroke="#0B1F3A" stroke-width="2.5"/>
    <!-- 4-point compass star, two-tone -->
    <!-- N point (light) -->
    <polygon points="60,6 52,60 60,60" fill="#0B1F3A"/>
    <polygon points="60,6 68,60 60,60" fill="#1E3A5F"/>
    <!-- E point -->
    <polygon points="114,60 60,52 60,60" fill="#1E3A5F"/>
    <polygon points="114,60 60,68 60,60" fill="#0B1F3A"/>
    <!-- S point -->
    <polygon points="60,114 68,60 60,60" fill="#0B1F3A"/>
    <polygon points="60,114 52,60 60,60" fill="#1E3A5F"/>
    <!-- W point -->
    <polygon points="6,60 60,68 60,60" fill="#1E3A5F"/>
    <polygon points="6,60 60,52 60,60" fill="#0B1F3A"/>
    <!-- Coral center pin -->
    <circle cx="60" cy="60" r="5" fill="#107A6E"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(150,0)">
    <text x="0" y="78" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="48" fill="#0B1F3A" letter-spacing="1">cardinal</text>
    <text x="2" y="108" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#5A6B7B" letter-spacing="6">CONSULTORA</text>
  </g>
</svg>
